name: 功能建议
description: 想要一个现在没有的能力，或者觉得某处设计可以更好
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        提之前建议先看一眼 `docs/LESSONS.md` 和 README 的「已知限制」——
        有些东西是**故意不做**的（比如把摘要注入提示词）。

  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题
      description: 先说场景，再说方案。避免只写"加个功能"
      placeholder: 我有三个插件，希望 digest 能按时间增量拉，而不是每次全量
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: 你设想的做法
      placeholder: digest_read 支持 since 参数，适配器返回带时间戳的条目
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: 你试过的替代方案
      description: 比如现在怎么绕过这个限制
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: 自查
      options:
        - label: 我已经看过 README 的「已知限制 / 不做什么」
          required: true
        - label: 这个建议不会削弱"信任由文件决定"这条原则
          required: true
