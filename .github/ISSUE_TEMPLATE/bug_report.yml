name: Bug 报告
description: 行为和文档不一致，或者直接报错了
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请尽量填全下面几项——尤其是**复现步骤**，否则很难定位。

        提之前可以先跑一遍 `node scripts/selftest.mjs`，把输出贴上来。

  - type: textarea
    id: what
    attributes:
      label: 发生了什么
      description: 一句话说清现象（报错原文优先）
      placeholder: 调用 digest_read 时报 "没有名为 xxx 的适配器"
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 你期望发生什么
      placeholder: 应该返回适配器内容
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      description: 命令、调用了哪个工具、传了什么参数
      placeholder: |
        1. node scripts/install.mjs --profile desktop
        2. 重启 DSH
        3. 调用 memory_append_inbox("...")
    validations:
      required: true

  - type: input
    id: env
    attributes:
      label: 环境
      description: DSH 版本 / Node 版本 / 操作系统
      placeholder: DSH 0.2.x / Node 22.13 / Windows 11
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 相关日志或输出
      description: selftest 输出、DSH 启动日志里的报错、`digest_list` 的返回等
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: 自查
      options:
        - label: 我已经确认这不是因为没重启 DSH（MCP server 只在启动时加载）
          required: true
        - label: 我贴出的内容里没有凭据、令牌、个人路径等敏感信息
          required: true
